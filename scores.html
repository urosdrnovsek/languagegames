<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Language Games</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .scores { width: 100%; max-width: 820px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
    .scores > p { grid-column: 1 / -1; text-align: center; color: var(--ink-soft); margin: 0; }
    .board { padding: 14px; background: var(--card); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); }
    .board:target { box-shadow: 0 0 0 5px var(--accent), 0 6px 0 var(--ink); }
    .board h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 1.3rem; }
    .board h2 .ico { width: 40px; height: 40px; }
    .board h2 .ico svg { width: 100%; height: 100%; }
    .board ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .board li { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 14px; background: #f8f9fa; font-weight: 700; }
    .board li .rank { width: 28px; text-align: center; font-size: 1.1rem; }
    .board li:nth-child(1) { background: #fff3bf; }
    .board li:nth-child(2) { background: #f1f3f5; }
    .board li:nth-child(3) { background: #ffe8cc; }
    .board li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board li.me { outline: 3px solid var(--accent); }
    .board .empty { color: var(--ink-soft); margin: 0; }
  </style>
</head>
<body>
  <main class="scores" id="scores"></main>
  <script src="shared/pictures.js"></script>
  <script src="shared/words.js"></script>
  <script src="shared/engine.js"></script>
  <script>
    (function () {
      document.title = LG.t('scores') + ' · ' + LG.t('appTitle');
      document.body.prepend(LG.topbar(LG.t('scores'), 'index.html'));
      const box = document.getElementById('scores');
      if (LG.settings.calm) {
        box.appendChild(LG.el('p', '', LG.t('calmScores')));
        return;
      }
      const points = (n) => LG.t('pointsN', { n: n });
      const d = new Date();
      const today = 'daily-' + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
      // The Daily Challenge, then every scored game.
      const boards = [[today, 'dailyChallenge', 'calendar', 'high', points]].concat(
        LG.SCORE_GAMES.map((g) => [g.id, g.title, g.pic, g.better, (n) => LG.formatScore(g.id, n)]));
      box.appendChild(LG.el('p', '', LG.t('scoresDesc')));
      const me = LG.currentPlayer();
      boards.forEach(([id, title, pic, better, format]) => {
        const board = LG.el('section', 'board');
        board.id = id;
        const h = LG.el('h2', '', '<span class="ico">' + LG.picture(pic) + '</span><span></span>');
        h.querySelector('span:last-child').textContent = LG.t(title);
        board.appendChild(h);
        const top = LG.topScores(id, better, 10);
        if (!top.length) board.appendChild(LG.el('p', 'empty', LG.t('noScores')));
        else {
          const ol = LG.el('ol');
          top.forEach((e, i) => {
            const p = e.p === 'guest' ? null : LG.playerById(e.p);
            const li = LG.el('li', (me ? e.p === me.id : e.p === 'guest') ? 'me' : '', '<span class="rank">' + (i + 1) + '</span>' + LG.avatarHtml(p) + '<span class="name"></span><span class="val"></span>');
            li.querySelector('.name').textContent = LG.playerName(p);
            li.querySelector('.val').textContent = format(e.s);
            ol.appendChild(li);
          });
          board.appendChild(ol);
        }
        box.appendChild(board);
      });
      if (location.hash) {
        const t = document.getElementById(location.hash.slice(1));
        if (t) t.scrollIntoView();
      }
    })();
  </script>
</body>
</html>
