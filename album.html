<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Language Games</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .album { width: 100%; max-width: 1040px; margin: 0 auto; padding: 8px 16px 40px; }
    .album-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; margin-bottom: 10px; }
    .album-head p { margin: 0; color: var(--ink-soft); }
    .total { width: min(420px, 100%); }
    .total-bar { height: 22px; border: 3px solid var(--ink); border-radius: 999px; background: var(--card); overflow: hidden; }
    .total-fill { height: 100%; background: var(--star); }
    .total b { display: block; margin-top: 4px; font-size: 1.2rem; }
    .page { margin-top: 22px; padding: 14px; background: var(--card); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); }
    .page h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.35rem; }
    .page h2 .ico { width: 40px; height: 40px; }
    .page h2 .ico svg { width: 100%; height: 100%; }
    .page h2 small { margin-left: auto; font-size: 1rem; color: var(--ink-soft); }
    .stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
    .sticker { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 16px; background: #fff9db; border: 3px solid var(--ink); font-weight: 700; font-size: 0.95rem; min-width: 0; }
    .sticker .s-pic { width: 64px; height: 64px; }
    .sticker .s-pic svg { width: 100%; height: 100%; }
    .sticker span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sticker.locked { background: #f1f3f5; border-style: dashed; border-color: #adb5bd; color: #adb5bd; }
    .sticker.locked .s-pic { filter: grayscale(1) brightness(1.6); opacity: 0.35; }
    .pips { display: flex; gap: 3px; }
    .pips i { width: 8px; height: 8px; border-radius: 50%; background: #dee2e6; }
    .pips i.on { background: var(--star); }
  </style>
</head>
<body>
  <main class="album" id="album"></main>
  <script src="shared/pictures.js"></script>
  <script src="shared/words.js"></script>
  <script src="shared/engine.js"></script>
  <script>
    (function () {
      document.title = LG.t('stickers') + ' · ' + LG.t('appTitle');
      document.body.prepend(LG.topbar(LG.t('stickers'), 'index.html'));
      const album = document.getElementById('album');
      const words = LG.words(LG.lang, { allTopics: true });

      function draw() {
        const counts = LG.stickerCounts();
        const have = words.filter((w) => (counts[w.pic] || 0) >= LG.STICKER_AT).length;
        album.innerHTML = '';
        const head = LG.el('div', 'album-head');
        head.append(LG.playerChip(draw), LG.el('p', '', LG.t('stickerHelp', { n: LG.STICKER_AT })));
        const total = LG.el('div', 'total', '<div class="total-bar"><div class="total-fill"></div></div><b></b>');
        total.querySelector('.total-fill').style.width = (have / words.length) * 100 + '%';
        total.querySelector('b').textContent = LG.t('stickerCount', { n: have, total: words.length });
        head.appendChild(total);
        album.appendChild(head);

        LG.TOPICS.forEach((t) => {
          const list = words.filter((w) => w.topic === t.id);
          if (!list.length) return;
          const got = list.filter((w) => (counts[w.pic] || 0) >= LG.STICKER_AT).length;
          const page = LG.el('section', 'page');
          const h = LG.el('h2', '', '<span class="ico">' + LG.picture(t.pic) + '</span><span></span><small></small>');
          h.querySelector('span:nth-child(2)').textContent = LG.t('topic_' + t.id);
          h.querySelector('small').textContent = LG.t('stickerCount', { n: got, total: list.length });
          const grid = LG.el('div', 'stickers');
          // Earned stickers first, then the ones closest to being earned.
          list.slice().sort((a, b) => (counts[b.pic] || 0) - (counts[a.pic] || 0)).forEach((w) => {
            const n = Math.min(LG.STICKER_AT, counts[w.pic] || 0);
            const earned = n >= LG.STICKER_AT;
            const s = LG.el('div', 'sticker' + (earned ? '' : ' locked'), '<div class="s-pic">' + LG.picture(w.pic) + '</div>');
            if (earned) s.appendChild(LG.el('span', '', LG.fmt(w.word)));
            else s.appendChild(LG.el('div', 'pips', Array.from({ length: LG.STICKER_AT }, (_, i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('')));
            grid.appendChild(s);
          });
          page.append(h, grid);
          album.appendChild(page);
        });
      }
      draw();
    })();
  </script>
</body>
</html>
