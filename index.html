<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Language Games</title>
  <meta name="description" content="Free reading games for children aged 5 to 7, in English, Slovenian, German, French and Spanish.">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .hub { width: 100%; max-width: 980px; margin: 0 auto; padding: 8px 16px 32px; }
    .hub-head { text-align: center; margin: 4px 0 22px; }
    .hub-head h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.2rem); }
    .hub-head p { margin: 4px 0 0; font-size: 1.2rem; color: var(--ink-soft); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
    .card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: var(--card); border: 4px solid var(--ink); border-radius: 28px;
      box-shadow: 0 7px 0 var(--ink); padding: 20px 18px 22px; text-decoration: none;
      transition: transform 0.12s;
    }
    .card:hover { transform: translateY(-3px); }
    .card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
    .card .art { width: 120px; height: 120px; }
    .card .art svg { width: 100%; height: 100%; }
    .card h2 { margin: 10px 0 4px; font-size: 1.6rem; }
    .card p { margin: 0 0 16px; color: var(--ink-soft); font-size: 1.05rem; flex: 1; }
    .card .go { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff;
      border: 3px solid var(--ink); border-radius: 999px; padding: 8px 22px; font-weight: 700; font-size: 1.2rem; }
    .card .go svg { width: 20px; height: 20px; }
    .card.book .go { background: var(--good); }
    .strip { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 30px 0 10px; }
    .strip div { width: 54px; height: 54px; }
    .strip svg { width: 100%; height: 100%; }
    .foot { text-align: center; color: var(--ink-soft); margin-top: 8px; }
    .hub-top { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 0; }
  </style>
</head>
<body>
  <div class="hub-top" id="tools"></div>
  <main class="hub">
    <header class="hub-head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <div id="voice"></div>
    <div class="cards" id="cards"></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <p class="foot" id="foot"></p>
  </main>

  <script src="shared/pictures.js"></script>
  <script src="shared/words.js"></script>
  <script src="shared/engine.js"></script>
  <script>
    (function () {
      document.title = LG.t('appTitle');
      document.getElementById('title').textContent = LG.t('appTitle');
      document.getElementById('subtitle').textContent = LG.t('hubSubtitle');
      document.getElementById('tools').append(LG.langSwitch(), LG.soundButton());
      document.getElementById('voice').appendChild(LG.voiceNotice());

      const games = [
        { path: 'games/letter-sounds/index.html', title: 'letterSounds', desc: 'letterSoundsDesc', pic: 'apple' },
        { path: 'games/picture-word/index.html', title: 'pictureWord', desc: 'pictureWordDesc', pic: 'cat' },
        { path: 'games/build-word/index.html', title: 'buildWord', desc: 'buildWordDesc', pic: 'sun' },
        { path: 'words.html', title: 'wordBook', desc: 'wordBookDesc', pic: 'book', cls: 'book' },
      ];
      const cards = document.getElementById('cards');
      games.forEach((g) => {
        const a = LG.el('a', 'card ' + (g.cls || ''));
        a.href = LG.link(g.path);
        a.innerHTML = '<div class="art">' + LG.picture(g.pic) + '</div>';
        a.append(LG.el('h2', '', LG.t(g.title)), LG.el('p', '', LG.t(g.desc)));
        a.appendChild(LG.el('span', 'go', LG.ICONS.play + '<span>' + LG.t('play') + '</span>'));
        cards.appendChild(a);
      });

      const strip = document.getElementById('strip');
      LG.sample(LG.words(LG.lang), 10).forEach((w) => strip.appendChild(LG.el('div', '', LG.picture(w.pic))));

      document.getElementById('foot').textContent =
        LG.t('wordsCount', { n: LG.words(LG.lang).length }) + ' · ' + LG.t('privacy');
    })();
  </script>
</body>
</html>
