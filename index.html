<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Language Games</title>
  <meta name="description" content="Free reading games for children aged 5 to 7, in English, Slovenian, German, French and Spanish.">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .hub { width: 100%; max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; }
    .hub-head { text-align: center; margin: 4px 0 18px; }
    .hub-head h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.2rem); }
    .hub-head p { margin: 4px 0 0; font-size: 1.2rem; color: var(--ink-soft); }
    .section { margin: 22px 0 0; }
    .section h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.5rem; }
    .section h2::after { content: ''; flex: 1; height: 4px; border-radius: 2px; background: rgba(47, 42, 40, 0.15); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: var(--card); border: 4px solid var(--ink); border-radius: 24px;
      box-shadow: 0 6px 0 var(--ink); padding: 14px 12px 16px; text-decoration: none;
      transition: transform 0.12s; font: inherit; cursor: pointer; color: inherit;
    }
    .card:hover { transform: translateY(-3px); }
    .card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
    .card .art { width: 84px; height: 84px; }
    .card .art svg { width: 100%; height: 100%; }
    .card h3 { margin: 8px 0 4px; font-size: 1.3rem; }
    .card p { margin: 0; color: var(--ink-soft); font-size: 0.98rem; }
    .card.race { background: #fff4e6; }
    .card.together { background: #e7f5ff; }
    .card.me { background: #ebfbee; }
    .card[hidden] { display: none; }
    .strip { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 30px 0 10px; }
    .strip div { width: 54px; height: 54px; }
    .strip svg { width: 100%; height: 100%; }
    .foot { text-align: center; color: var(--ink-soft); margin-top: 8px; }
    .hub-top { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 16px 0; }
    .hub-top .player-chip { margin: 0 auto 0 0; }
    @media (max-width: 420px) { .cards { grid-template-columns: 1fr 1fr; gap: 12px; } .card .art { width: 64px; height: 64px; } .card p { display: none; } }
  </style>
</head>
<body>
  <div class="hub-top" id="tools"></div>
  <div id="banner"></div>
  <main class="hub">
    <header class="hub-head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <div id="voice"></div>
    <div id="sections"></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <p class="foot" id="foot"></p>
  </main>

  <script src="shared/pictures.js"></script>
  <script src="shared/words.js"></script>
  <script src="shared/engine.js"></script>
  <script>
    (function () {
      const calm = LG.settings.calm;
      document.title = LG.t('appTitle');
      document.getElementById('title').textContent = LG.t('appTitle');
      document.getElementById('subtitle').textContent = LG.t('hubSubtitle');
      const teacher = LG.el('a', 'icon-btn', LG.ICONS.gear);
      teacher.href = LG.link('settings.html');
      teacher.setAttribute('aria-label', LG.t('forTeachers'));
      teacher.title = LG.t('forTeachers');
      document.getElementById('tools').append(LG.playerChip(), teacher, LG.langSwitch(), LG.soundButton());
      document.getElementById('voice').appendChild(LG.voiceNotice());
      const showBanner = () => {
        const b = LG.challengeBanner();
        document.getElementById('banner').replaceChildren(...(b ? [b] : []));
      };
      showBanner();

      const g = (id, title, pic, extra) => Object.assign({ path: 'games/' + id + '/index.html', title: title, desc: title + 'Desc', pic: pic }, extra || {});
      const sections = [
        ['sectionLearn', '', [
          g('letter-sounds', 'letterSounds', 'apple'),
          g('picture-word', 'pictureWord', 'cat'),
          g('build-word', 'buildWord', 'sun'),
          g('letter-train', 'train', 'train'),
          g('bubbles', 'bubbles', 'bubbles'),
          g('conveyor-belt', 'belt', 'box'),
          { path: 'words.html', title: 'wordBook', desc: 'wordBookDesc', pic: 'book' },
        ]],
        ['sectionPlay', '', [
          g('memory', 'memory', 'cherry'),
          g('odd-one-out', 'oddOne', 'banana'),
          g('balloon-pop', 'balloon', 'balloon'),
          g('word-search', 'wordSearch', 'glasses'),
          g('picture-hunt', 'pictureHunt', 'map'),
          g('frog-jump', 'frogJump', 'frog'),
          g('fishing', 'fishing', 'fish'),
        ]],
        ['sectionRace', 'race', [
          g('beat-clock', 'beatClock', 'clock'),
          g('word-rain', 'wordRain', 'cloud'),
          g('rocket-race', 'rocketRace', 'rocket'),
          g('whack-a-mole', 'whack', 'mole'),
          { path: 'games/beat-clock/index.html', query: 'daily=1', title: 'dailyChallenge', desc: 'dailyDesc', pic: 'calendar' },
        ], calm],
        ['sectionTogether', 'together', [
          g('teams', 'teamBattle', 'crown'),
          g('tug-of-war', 'tug', 'rope', { hide: calm }),
          g('bingo', 'bingo', 'flag'),
          { action: enterCode, title: 'classChallenge', desc: 'classChallengeDesc', pic: 'trophy' },
          { path: 'scoreboard.html', title: 'scoreboard', desc: 'scoreboardDesc', pic: 'calendar', hide: calm },
          // Only when the games are served by the classroom program.
          { path: 'live/board.html', title: 'liveClassroom', desc: 'liveDesc', pic: 'computer', hide: true, id: 'live-card' },
        ]],
        ['sectionMe', 'me', [
          { path: 'album.html', title: 'stickers', desc: 'stickersDesc', pic: 'star' },
          { path: 'scores.html', title: 'scores', desc: 'scoresDesc', pic: 'crown', hide: calm },
        ]],
      ];
      const box = document.getElementById('sections');
      sections.forEach(([heading, cls, items, hidden]) => {
        if (hidden) return;
        const sec = LG.el('section', 'section');
        sec.appendChild(LG.el('h2', '', LG.t(heading)));
        const cards = sec.appendChild(LG.el('div', 'cards'));
        items.filter((it) => !it.hide || it.id).forEach((it) => {
          const card = LG.el(it.action ? 'button' : 'a', 'card ' + cls);
          if (it.id) {
            card.id = it.id;
            card.hidden = true;
          }
          if (it.action) {
            card.type = 'button';
            card.addEventListener('click', it.action);
          } else {
            card.href = LG.link(it.path) + (it.query ? '&' + it.query : '');
          }
          card.innerHTML = '<div class="art">' + LG.picture(LG.PICTURES[it.pic] ? it.pic : 'star') + '</div>';
          card.append(LG.el('h3', '', LG.t(it.title)), LG.el('p', '', LG.t(it.desc)));
          cards.appendChild(card);
        });
        box.appendChild(sec);
      });

      // Class challenge: the code from the teacher makes every game use the
      // same words on every device, until the challenge is ended.
      function enterCode() {
        const o = LG.el('div', 'overlay');
        const panel = LG.el('form', 'panel');
        const input = LG.el('input', 'name-input code-input');
        input.placeholder = 'XXXX-XXXX';
        input.autocomplete = 'off';
        input.setAttribute('aria-label', LG.t('enterCode'));
        const error = LG.el('p', 'gate-error');
        const go = LG.el('button', 'big-btn', '<span>' + LG.t('join') + '</span>');
        go.type = 'submit';
        const close = LG.el('button', 'big-btn secondary', '<span>' + LG.t('allGames') + '</span>');
        close.type = 'button';
        close.addEventListener('click', () => o.remove());
        panel.append(LG.el('div', 'panel-pic', LG.picture('trophy') || LG.picture('crown')), LG.el('h2', '', LG.t('classChallenge')), LG.el('p', '', LG.t('classChallengeDesc')), input, error, go);
        panel.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!LG.startChallenge(input.value)) {
            error.textContent = LG.t('wrongCode');
            LG.shake(panel);
            return;
          }
          o.remove();
          showBanner();
          LG.toast('<span>' + LG.t('challengeOn') + '</span>');
        });
        o.appendChild(panel);
        document.body.appendChild(o);
        input.focus();
      }

      // Show Live Classroom when the classroom program (always plain http)
      // serves these pages.
      if (!calm && location.protocol === 'http:') LG.api('info').then((i) => i.ok && (document.getElementById('live-card').hidden = false)).catch(() => {});

      const strip = document.getElementById('strip');
      LG.sample(LG.words(LG.lang), 10).forEach((w) => strip.appendChild(LG.el('div', '', LG.picture(w.pic))));

      const foot = document.getElementById('foot');
      foot.textContent = LG.t('wordsCount', { n: LG.words(LG.lang, { allTopics: true }).length }) + ' · ' + LG.t('privacy') + ' · ';
      const teacherLink = LG.el('a', '', LG.t('forTeachers'));
      teacherLink.href = LG.link('settings.html');
      foot.appendChild(teacherLink);
    })();
  </script>
</body>
</html>
